<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A cinematic robot-dog maze loading screen prototype." />
  <title>Robot Dog Loading Scene</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The WebGL scene fills the viewport. This wrapper can later be mounted inside another website. -->
  <main id="loading-experience" aria-label="Interactive loading experience">
    <canvas id="scene-canvas"></canvas>

    <!-- Small interface layer kept separate from the 3D world for easy website integration later. -->
    <div id="hud" class="hud">
      <div class="hud__brand">HADIYA</div>
      <div class="hud__status"><span class="status-dot"></span><span id="status-text">INITIALIZING</span></div>
    </div>

    <div id="finish-card" class="finish-card" aria-hidden="true">
      <span>PORTFOLIO READY</span>
      <small>ENTERING THE WORKSPACE</small>
    </div>

    <!-- This white layer performs the hand-off from the 3D intro to the future website. -->
    <div id="reveal" class="reveal"></div>
  </main>

  <!-- ES modules let the project stay dependency-free apart from the Three.js CDN import. -->
  <script type="module" src="main.js"></script>
</body>
</html>
