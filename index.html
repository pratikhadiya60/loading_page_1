<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Robot Dog Maze Loading Experience</title>
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- The real Three.js loading experience. No visual fallback overlays are
       mounted above this canvas, so the rendered maze and robot dog remain
       the only visual experience when the renderer initializes. -->
  <div id="loader-root">
    <canvas id="loader-canvas"></canvas>
    <div id="status-hud" aria-live="polite">
      <span id="status-text">INITIALIZING</span>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
