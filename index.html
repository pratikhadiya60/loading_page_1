<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Robot Dog Maze Loading Experience</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js is loaded from a CDN via an import map. The browser (not this
       project's build step) resolves "three" to this URL, so no bundler is
       required. If you later self-host, just point this at a local file. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- 3D canvas mounts here -->
  <div id="loader-root">
    <canvas id="loader-canvas"></canvas>

    <!-- Minimal, subtle status readout instead of a progress bar -->
    <div id="status-hud" aria-live="polite">
      <span id="status-text">INITIALIZING</span>
    </div>
  </div>

  <!-- Shown only if WebGL is unavailable -->
  <div id="webgl-fallback" hidden>
    <div class="fallback-card">
      <p>Your browser can't display the 3D preview.</p>
      <p class="fallback-sub">Continuing to the site…</p>
    </div>
  </div>

  <!-- Stand-in for the future portfolio site. In the real integration this
       block goes away and the host page listens for "robotDogIntroComplete"
       instead. Kept here so this project is viewable and testable on its own. -->
  <main id="website-placeholder" hidden>
    <h1>Portfolio site loads here</h1>
    <p>The loading experience dispatched <code>robotDogIntroComplete</code> and handed off control.</p>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
